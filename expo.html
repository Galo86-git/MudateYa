:root{--navy:#003580;--navy-dark:#001A40;--green:#22C36A;--gold:#C6A464;--ink:#0b1b33}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:#fff;background:var(--navy-dark);line-height:1.5;overflow-x:hidden}

.stage{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;background:radial-gradient(120% 100% at 50% 0%,#003a8f 0%,#001A40 55%,#000c22 100%);overflow:hidden}

/* ── Fondo animado: líneas tipo red/skyline, sutil, no distrae de los botones ── */
.lines{position:absolute;inset:0;width:100%;height:100%;opacity:.85;pointer-events:none}
.lines path{fill:none;stroke-width:2;stroke-dasharray:7 11;animation:fluir 14s linear infinite;filter:drop-shadow(0 0 3px currentColor)}
.lines path:nth-child(1){stroke:var(--green);animation-duration:16s}
.lines path:nth-child(2){stroke:var(--gold);animation-duration:20s;animation-direction:reverse}
.lines path:nth-child(3){stroke:#5b9dff;animation-duration:24s}
.lines path:nth-child(4){stroke:var(--green);opacity:.75;animation-duration:18s;animation-direction:reverse}
.lines circle{fill:var(--green);animation:pulso 3s ease-in-out infinite;filter:drop-shadow(0 0 5px var(--green))}
.lines circle:nth-of-type(2n){fill:var(--gold);animation-delay:.8s;filter:drop-shadow(0 0 5px var(--gold))}
.lines circle:nth-of-type(3n){fill:#5b9dff;animation-delay:1.6s;filter:drop-shadow(0 0 5px #5b9dff)}
@keyframes fluir{to{stroke-dashoffset:-320}}
@keyframes pulso{0%,100%{opacity:.35;r:3}50%{opacity:1;r:5.5}}
@media (prefers-reduced-motion: reduce){.lines path,.lines circle{animation:none}}

.content{position:relative;z-index:1;max-width:460px;width:100%}
.brand{font-family:'Bebas Neue',Inter,sans-serif;font-size:22px;letter-spacing:2px;color:#fff;margin-bottom:22px;opacity:.9}
.brand span{color:var(--green)}

.badge{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px);color:#e8eeff;font-size:12.5px;font-weight:700;letter-spacing:.4px;padding:9px 18px;border-radius:999px;margin-bottom:22px;line-height:1.5}
.badge b{color:var(--gold)}

h1{font-size:clamp(26px,7vw,34px);line-height:1.18;margin:0 0 12px;font-weight:800;letter-spacing:-.3px}
h1 span{color:var(--green)}
.sub{font-size:15.5px;color:#c3d3f5;margin:0 0 30px;padding:0 6px}

.opciones{display:flex;flex-direction:column;gap:14px}
.opcion{display:flex;align-items:center;gap:16px;background:#fff;color:var(--ink);text-decoration:none;border-radius:18px;padding:18px 20px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s, box-shadow .15s;border:2px solid transparent}
.opcion:active{transform:scale(.98)}
.opcion .ico{flex:0 0 auto;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
.opcion.inmo .ico{background:#E5ECF6;color:var(--navy)}
.opcion.asesor .ico{background:#E3F9EC;color:#0F8A44}
.opcion.dev .ico{background:#FBF0DE;color:#8A6416}
.opcion .txt{flex:1;min-width:0}
.opcion .txt strong{display:block;font-size:17.5px;font-weight:800;margin-bottom:2px}
.opcion .txt small{display:block;font-size:13px;color:#5b6b82;font-weight:500}
.opcion .arrow{flex:0 0 auto;font-size:20px;color:#94A3B8}
.opcion.inmo:hover{border-color:var(--navy)}
.opcion.asesor:hover{border-color:var(--green)}
.opcion.dev:hover{border-color:var(--gold)}

.foot{position:relative;z-index:1;margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:7px}
.foot-brand{font-size:16px;font-weight:800;color:#cfe0ff;letter-spacing:.3px}
.foot-ig{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:#8ba3d6;text-decoration:none}
.foot-ig:hover{color:#cfe0ff}
</style>
